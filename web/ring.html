<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔥💍 Puffin Login Ring — GeoCities Family WebRing</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070913;
      --panel: rgba(20, 24, 46, 0.9);
      --border: rgba(251, 191, 36, 0.35);
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Nunito', 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #27173a 0%, #090c1a 60%, #05070f 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 1.25rem;
    }
    header {
      max-width: 820px;
      margin: 0 auto 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      background: var(--panel);
      border: 1.5px solid var(--border);
      padding: 0.85rem 1.15rem;
      border-radius: 1.15rem;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 900;
      background: linear-gradient(90deg, #fde047, #fb923c, #fde047);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand-sub {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 700;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .nav-link {
      color: #fde047;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(250, 204, 21, 0.4);
      background: rgba(250, 204, 21, 0.1);
    }
    .nav-link:hover {
      background: rgba(250, 204, 21, 0.22);
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }
    .panel-card {
      background: var(--panel);
      border: 1.5px solid var(--border);
      border-radius: 1.35rem;
      padding: 1.25rem;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.6);
    }
    .section-title {
      margin: 0 0 0.85rem;
      font-size: 1.05rem;
      font-weight: 900;
      color: #fde047;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>🔥💍 Puffin Login Ring</h1>
      <span class="brand-sub">90s GeoCities Family WebRing • Central SSOT on palladius/vetrina (supports_puffin_login)</span>
    </div>
    <div class="header-right">
      <a class="nav-link" href="./index.html">🚰 Play Tubature</a>
      <a class="nav-link" href="https://palladius.github.io/vetrina/#puffin-ring" target="_blank" rel="noopener">🎠 Vetrina #puffin-ring ↗</a>
      <puffin-login id="puffin-widget" app-id="tubature" require-login="false"></puffin-login>
    </div>
  </header>

  <main>
    <section class="panel-card">
      <puffin-ring id="puffin-ring-hub"></puffin-ring>
    </section>

    <section class="panel-card">
      <h2 class="section-title">
        <span>🏆 Global Ring Hall of Fame (All Connected Games)</span>
        <span style="font-size:0.75rem; color:#94a3b8; font-weight:700;">Hover any hero to play Veo 3.1 animation & click game badge to jump!</span>
      </h2>
      <puffin-leaderboard id="ring-global-lb" filter-game="ALL"></puffin-leaderboard>
    </section>
  </main>

  <script type="module" src="./src/puffin-login.js"></script>
</body>
</html>
