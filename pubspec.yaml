name: tubature
description: "Tubature — An enchanting pipe-puzzle game starring Riccardo the Dungeon Plumber."
publish_to: 'none'

version: 2.10.0+287

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  equatable: ^2.0.7
  cupertino_icons: ^1.0.8
  video_player: ^2.9.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
    - assets/goodies/
    - assets/cross/
    - assets/voices/
    - assets/voices/good/
    - assets/voices/bad/
    - assets/voices/inbox/
    - assets/sounds/
    - assets/sounds/good-quality/
