            if (v === '1' || v === 'true' || v === 'on' || v === 'yes') override = true;
            else if (v === '0' || v === 'false' || v === 'off' || v === 'no') override = false;
          }
        });
        var saved = null;
        try {
          var s = window.localStorage.getItem('tubature_rpi_mode');
          if (s === '1') saved = true;
          else if (s === '0') saved = false;
        } catch (_) {}

        var ua = (navigator.userAgent || '') + ' ' + (navigator.platform || '');
        var isArmLinux = /aarch64|armv7l|armv8l|arm64|raspberry|rpi|sguisa/i.test(ua) && /Linux/i.test(ua);
        var isLowDprRunner = (window.devicePixelRatio > 0 && window.devicePixelRatio <= 0.85);
        var isLowCoreLinux = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4 && /Linux/i.test(ua) && !/x86_64/i.test(ua));
        var autoDetected = Boolean(isArmLinux || isLowDprRunner || isLowCoreLinux);

        var active = override !== null ? override : (saved !== null ? saved : autoDetected);
        window._tubatureLowEnd = Boolean(active);
        if (window._tubatureLowEnd) {
          document.documentElement.classList.add('rpi-mode');
        }

        window._setTubatureRpiMode = function(enabled) {
          var flag = Boolean(enabled);
          window._tubatureLowEnd = flag;
          document.documentElement.classList.toggle('rpi-mode', flag);
          try {
            window.localStorage.setItem('tubature_rpi_mode', flag ? '1' : '0');

        // Fix for WebKit2GTK 2.54 with WEBKIT_HARDWARE_ACCELERATION_POLICY_NEVER on Broadcom VideoCore VI:

        // Removing window.ImageDecoder before Flutter bootstrap forces CanvasKit to use its reliable

        if (window._tubatureLowEnd || isArmLinux || isLowDprRunner) {

  <script>
    window._tubatureAudio = {
      ctx: null,
      currentVoiceAudio: null,
      init: function() {
        if (!this.ctx) {
          var AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      click: function() {
        this.init();
        if (!this.ctx) return;
        var t = this.ctx.currentTime;
        var osc = this.ctx.createOscillator();
        var gain = this.ctx.createGain();
        var freq = 600 + Math.random() * 250;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.4, t + 0.04);
        gain.gain.setValueAtTime(0.2, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.05);
      },
      water: function(chain) {
        this.init();
        if (!this.ctx) return;
        var t = this.ctx.currentTime;
        var count = Math.min(Math.max(chain, 1), 6);
        for (var i = 0; i < count; i++) {
          var delay = i * 0.07;
          var osc = this.ctx.createOscillator();
          var gain = this.ctx.createGain();
          var baseFreq = 400 + Math.random() * 200 + (i * 80);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(baseFreq, t + delay);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.6, t + delay + 0.09);
          gain.gain.setValueAtTime(0.001, t + delay);
          gain.gain.linearRampToValueAtTime(0.18, t + delay + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + delay);
          osc.stop(t + delay + 0.13);
        }
      },
      glub: function() {
        this.init();
        if (!this.ctx) return;
        var t = this.ctx.currentTime;
        var pitches = [260, 360, 490, 650];
        for (var i = 0; i < pitches.length; i++) {
          var delay = i * 0.13;
          var osc = this.ctx.createOscillator();
          var gain = this.ctx.createGain();
          var freq = pitches[i];
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq * 0.85, t + delay);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.55, t + delay + 0.09);
          gain.gain.setValueAtTime(0.001, t + delay);
          gain.gain.linearRampToValueAtTime(0.28, t + delay + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + delay);
          osc.stop(t + delay + 0.16);
        }
      },
      fanfare: function() {
        this.init();
        if (!this.ctx) return;
        var t = this.ctx.currentTime;
        var notes = [523.25, 659.25, 783.99, 1046.50];
        for (var i = 0; i < notes.length; i++) {
          var delay = i * 0.14;
          var osc = this.ctx.createOscillator();
          var gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(notes[i], t + delay);
          gain.gain.setValueAtTime(0.001, t + delay);
          gain.gain.linearRampToValueAtTime(0.25, t + delay + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, t + delay + (i === 3 ? 0.9 : 0.45));
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + delay);
          osc.stop(t + delay + (i === 3 ? 1.0 : 0.5));
        }
      },
      schmoogle: function() {
        this.init();
        if (!this.ctx) return;
        var t = this.ctx.currentTime;
        var bellOsc = this.ctx.createOscillator();
        var bellGain = this.ctx.createGain();
        bellOsc.type = 'sine';
        bellOsc.frequency.setValueAtTime(220, t);
        bellOsc.frequency.exponentialRampToValueAtTime(110, t + 3.0);
        bellGain.gain.setValueAtTime(0.001, t);
        bellGain.gain.linearRampToValueAtTime(0.3, t + 0.5);
        bellGain.gain.exponentialRampToValueAtTime(0.001, t + 3.0);
        bellOsc.connect(bellGain);
        bellGain.connect(this.ctx.destination);
        bellOsc.start(t);
        bellOsc.stop(t + 3.1);
        var pentatonic = [440, 493.88, 554.37, 659.25, 739.99, 880, 987.77, 1108.73, 1318.51, 1479.98];
        for (var i = 0; i < pentatonic.length; i++) {
          var delay = i * 0.12;
          var osc = this.ctx.createOscillator();
          var gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(pentatonic[i], t + delay);
          gain.gain.setValueAtTime(0.001, t + delay);
          gain.gain.linearRampToValueAtTime(0.15, t + delay + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 1.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + delay);
          osc.stop(t + delay + 1.6);
        }
      },
      playVoice: function(path) {
        this.init();
        try {
          if (this.currentVoiceAudio) {
            this.currentVoiceAudio.pause();
            this.currentVoiceAudio = null;
          }
          var baseHref = document.querySelector('base') ? document.querySelector('base').getAttribute('href') : '';
          if (baseHref && !baseHref.endsWith('/')) baseHref += '/';
          var clean = path.startsWith('/') ? path.substring(1) : path;
          
          var urls = [
            (baseHref || '') + 'assets/' + clean,
            (baseHref || '') + clean,
            'assets/' + clean,
            clean
          ];
          
          var tryPlay = function(i) {
            if (i >= urls.length) return;
            var a = new Audio(urls[i]);
            a.volume = 0.95;
            window._tubatureAudio.currentVoiceAudio = a;
            var promise = a.play();
            if (promise !== undefined) {
              promise.catch(function() {
                tryPlay(i + 1);
              });
            }
          };
          tryPlay(0);
        } catch (_) {}
      },
      crack: function() {
        this.init();
        if (!this.ctx) return;
        var t = this.ctx.currentTime;
        // White noise burst (glass shatter)
        var bufSize = this.ctx.sampleRate * 0.08;
        var buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        var data = buf.getChannelData(0);
        for (var i = 0; i < bufSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 3);
        }
        var noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        var noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.35, t);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        // High-freq snap oscillator
        var osc = this.ctx.createOscillator();
        var oscGain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1800 + Math.random() * 600, t);
        osc.frequency.exponentialRampToValueAtTime(200, t + 0.06);
        oscGain.gain.setValueAtTime(0.2, t);
        oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        noise.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);
        noise.start(t);
        noise.stop(t + 0.09);
        osc.start(t);
        osc.stop(t + 0.07);
      }
    };
  </script>

  <script type="module">
    import { PuffinLogin } from './src/puffin-login.js';

    const widget = document.getElementById('puffin-widget');
    const hud = document.getElementById('tubature-puffin-hud');
    const hofSection = document.getElementById('hof-section');
    const hofCloseBtn = document.getElementById('tubature-hof-close-btn');

    if (hofCloseBtn && hofSection) {
      hofCloseBtn.addEventListener('click', () => {
        hofSection.hidden = true;
      });
    }

    // Prevent keyboard events inside <puffin-login> dialog from triggering Flutter canvas shortcuts
    for (const evtName of ['keydown', 'keyup', 'keypress']) {
      window.addEventListener(
        evtName,
        (e) => {
          const path = typeof e.composedPath === 'function' ? e.composedPath() : [];
          if (path.includes(widget) || (widget?.$dialog && widget.$dialog.open)) {
            e.stopImmediatePropagation();
          }
        },
        true
      );
    }

    let _lastScoreSignature = '';
    let _lastScoreTimestampMs = 0;

    function shouldSubmitSignature(sig) {
      const now = Date.now();
      if (sig === _lastScoreSignature && now - _lastScoreTimestampMs < 6000) {
        return false;
      }
      _lastScoreSignature = sig;
      _lastScoreTimestampMs = now;
      return true;
    }

    // Bridge helper for Flutter Web <-> PuffinLogin Web Component
    window._puffinFlutterBridge = {
      openModal(preselectUserId) {
        if (widget && typeof widget.openModal === 'function') {
          widget.openModal(preselectUserId || null);
        }
      },
      setHallOfFameVisible(visible) {
        if (hofSection) {
          hofSection.hidden = !visible;
        }
      },
      async submitScoreFromFlutter(payloadJson) {
        try {
          const payload = JSON.parse(payloadJson);
          const extra = payload.extra || {};
          const sig = `${extra.level || 1}:${extra.moves || 0}:${extra.total_tiles || 0}`;
          if (!shouldSubmitSignature(sig)) {
            return '';
          }
          const result = await PuffinLogin.submitScore({
            ...payload,
            appId: payload.game_id || payload.appId || 'tubature',
            game_id: payload.game_id || payload.appId || 'tubature',
          });
          return JSON.stringify(result);
        } catch (err) {
          console.warn('[PuffinLogin Bridge] submitScore error:', err);
          return '';
        }
      },
    };

    // Intercept window._tubatureGrid exported by Flutter's GameNotifier._exportGridToJs()
    let _rawTubatureGrid = window._tubatureGrid || null;
    let _wasComplete = false;
    let _levelStartedAtIso = new Date().toISOString();

    function handleTubatureGridUpdate(jsonStr) {
      if (!jsonStr || typeof jsonStr !== 'string') return;
      try {
        const state = JSON.parse(jsonStr);
        if (!state.isComplete && state.moveCount === 0) {
          _wasComplete = false;
          _levelStartedAtIso = PuffinLogin.startGameSession('tubature');
          if (hofSection) hofSection.hidden = true;
          if (hud) hud.hidden = false;
        } else if (state.isComplete && !_wasComplete) {
          _wasComplete = true;
          const diff = state.difficulty || 'Easy';
          const baseScore = diff === 'Hard' ? 3500 : diff === 'Medium' ? 2200 : 1200;
          const totalTiles = Number(state.totalTiles) || 25;
          const moves = Number(state.moveCount) || 1;
          const efficiencyBonus = Math.max(100, (totalTiles * 3 - moves) * 35);
          const streakBonus = (Number(state.levelsCompleted) || 0) * 300;
          const finalScore = baseScore + efficiencyBonus + streakBonus;
          const gridDim = `${state.rows || 6}x${state.cols || 6}`;
          const lvlNum = state.levelNumber || 1;
          const sig = `${lvlNum}:${moves}:${totalTiles}`;

          if (shouldSubmitSignature(sig)) {
            const endedIso = new Date().toISOString();
            const durationSec = Math.max(
              1,
              Math.round((Date.parse(endedIso) - Date.parse(_levelStartedAtIso)) / 1000) || 60
            );
            PuffinLogin.submitScore({
              game_id: 'tubature',
              score: finalScore,
              started_at: _levelStartedAtIso,
              ended_at: endedIso,
              duration_sec: durationSec,
              summary_text: `Connected all ${totalTiles} dungeon conduits on Level #${lvlNum} (${diff}, ${gridDim}) in ${moves} moves!`,
              extra: {
                difficulty: String(diff).toLowerCase(),
                level: lvlNum,
                grid: gridDim,
                grid_size: Number(state.rows) || 6,
                pieces: totalTiles,
                total_tiles: totalTiles,
                moves,
                hints: 0,
                goodies_unlocked: Array.isArray(state.goodiesUnlocked) ? state.goodiesUnlocked : [],
              },
            });
          }

          // Auto-hide top-right HUD when VictoryOverlay modal appears so it never overlaps the modal card
          setTimeout(() => {
            if (_wasComplete && hud) {
              hud.hidden = true;
            }
          }, 2750);
        } else if (!state.isComplete) {
          _wasComplete = false;
          if (hud) hud.hidden = false;
        }
      } catch (_) {}
    }

    Object.defineProperty(window, '_tubatureGrid', {
      configurable: true,
      enumerable: true,
      get() {
        return _rawTubatureGrid;
      },
      set(val) {
        _rawTubatureGrid = val;
        handleTubatureGridUpdate(val);
      },
    });
  </script>
